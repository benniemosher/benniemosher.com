services:
  jekyll:
    image: ruby:4.0-slim@sha256:67fb5dbef860bb2205a3c69799f7f1c4f5b01c943ae089de436bc266ea8c102e
    working_dir: /site
    ports:
      - "4000:4000"
    volumes:
      - .:/site
      - bundle_cache:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development
    command: >
      bash -c "
        apt-get update -qq &&
        apt-get install -y --no-install-recommends build-essential git &&
        bundle install &&
        bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling
      "

volumes:
  bundle_cache:
