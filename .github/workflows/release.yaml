---
on:
  push:
    branches:
      - main

jobs:
  release:
    uses: "Mosher-Labs/.github/.github/workflows/release.yml@079c12894bb1f077a29108c693dc8a1226ed160e" # v0.12.4
    permissions:
      contents: write

  heimdallr:
    needs: release
    uses: "Mosher-Labs/.github/.github/workflows/heimdallr.yml@079c12894bb1f077a29108c693dc8a1226ed160e" # v0.12.4
    permissions:
      issues: write
      pull-requests: write
    secrets: inherit
    with:
      slack_message: "The project <https://github.com/${{ github.repository }}|${{ github.repository }}> just released version <https://github.com/${{ github.repository }}/releases/tag/${{ needs.release.outputs.next_version }}|${{ needs.release.outputs.next_version }}>."
